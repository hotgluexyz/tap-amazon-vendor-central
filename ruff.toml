target-version = "py38"
line-length = 100

exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    ".secrets",
    ".vscode",
    ".tox",
]

[lint]
extend-select = ["C901"]
ignore = ["E722", "E712"]

[lint.mccabe]
max-complexity = 21

# Legacy tap code; drop these ignores after a dedicated lint cleanup PR.
[lint.per-file-ignores]
"tap_amazon_vendor_central/*.py" = ["F401", "F541", "F841", "F811", "E402", "F601"]
